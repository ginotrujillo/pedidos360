# Perfil cloud (EP4): backend en EC2 conectado al CLUSTER RabbitMQ de 2 nodos (docker-compose.cloud.yml).
# Base de datos H2 en memoria para simplificar la demostración de mensajería.
# Las credenciales de RabbitMQ llegan por variables de entorno (nunca escritas aquí).
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${ENTRA_TENANT_ID:d39637a6-cb63-4031-b19a-d1c1a17eb202}/v2.0
  datasource:
    url: jdbc:h2:mem:pedidos360
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    # Los dos nodos del clúster: si uno cae, el cliente se conecta al otro
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 10s
