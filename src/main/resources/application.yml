server:
  port: 8080

spring:
  application:
    name: pedidos360
  profiles:
    active: dev

app:
  security:
    audience: ${ENTRA_API_CLIENT_ID:da4ade51-40ca-4222-8838-306a092a85c1}
  rabbitmq:
    exchange:
      direct: pedidos.direct
      topic: pedidos.topic
    queue:
      stock: pedidos.stock.queue
      notificaciones: pedidos.notificaciones.queue
      auditoria: pedidos.auditoria.queue
    dlq:
      stock: pedidos.stock.dlq
      notificaciones: pedidos.notificaciones.dlq
      auditoria: pedidos.auditoria.dlq
    routing:
      aceptado: pedido.aceptado.evento
      wildcardEstado: pedido.*.evento
      wildcardTodo: pedido.#

management:
  endpoints:
    web:
      exposure:
        include: health